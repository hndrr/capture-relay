name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Package extension
        run: npm run package

      - name: Verify zip contents
        run: |
          zip_file=$(ls release/*.zip | head -n 1)
          unzip -l "$zip_file"
          unzip -Z1 "$zip_file" | grep -qx "manifest.json"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: capture-relay-extension
          path: release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: capture-relay-extension
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/*.zip --generate-notes
